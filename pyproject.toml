[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mister-jp-library"
version = "0.1.0"
description = "Manage Japanese game titles and artwork on PC and transfer them to MiSTer Console Mode"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wabisukecx" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.7,<7"]

[project.scripts]
mister-jp-library = "main:main"
mister-jp-library-gui = "gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "local_rom", "systems", "workflow"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["artwork*", "consolemode*", "database*", "gui*", "metadata*", "mister*"]
namespaces = false
