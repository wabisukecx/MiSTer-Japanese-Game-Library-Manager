name: test
on: [push, pull_request]
jobs:
  unittest:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "PyQt6>=6.7,<7"
      - run: python -m unittest discover -s tests -v
